<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#24140D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Crumbworks">
<meta name="description" content="Bake cookies, build a bakery empire, and ascend.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Crumbworks Bakery</title>
<style>
/* ============ Design tokens: a bakery after dark ============ */
:root{
  --bg:#24140D; --panel:#33201A; --panel2:#422A20; --panel3:#50342A;
  --cream:#F6E7CF; --muted:#C9AE8E; --gold:#F2C14E; --pist:#9BC59D;
  --line:#5A3A2C; --dark:#170C07;
  --slab:"Rockwell","Roboto Slab","Zilla Slab","Clarendon","Georgia",serif;
  --sans:"Avenir Next","Avenir","Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--cream);font-family:var(--sans);overflow:hidden;-webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
input,textarea{-webkit-user-select:text;user-select:text}
#app{padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
#mid,#right,#modalBox{-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#cookieBtn{touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--pist);outline-offset:2px}
#app{display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);height:100vh;height:100dvh}

/* ============ Header: news ticker + menu ============ */
header{display:flex;align-items:stretch;background:var(--dark);border-bottom:2px solid var(--line);min-height:42px}
#ticker{flex:1;min-width:0;overflow:hidden;position:relative;cursor:pointer;display:flex;align-items:center}
#tickerText{white-space:nowrap;padding-left:100%;font-family:var(--slab);color:var(--muted);font-size:.95rem}
#tickerText.run{animation:marquee var(--dur,18s) linear forwards}
@keyframes marquee{to{transform:translateX(-100%)}}
#ticker::before{content:"Crumb Gazette";flex:none;position:relative;z-index:2;background:var(--gold);color:var(--dark);font-family:var(--slab);font-weight:700;padding:0 12px;height:100%;display:flex;align-items:center;font-size:.85rem}
.menu{display:flex;gap:2px;padding:4px}
.menu button{background:var(--panel2);border:0;border-radius:8px;padding:6px 12px;font-size:.9rem}
.menu button:hover{background:var(--panel3)}
#ascendBtn{display:none;background:linear-gradient(180deg,#FFF3C4,#F2C14E);color:var(--dark);font-weight:700;animation:pulseGold 1.6s ease-in-out infinite}
@keyframes pulseGold{50%{box-shadow:0 0 14px #F2C14E}}

/* ============ Main three-column layout ============ */
#main{display:grid;grid-template-columns:minmax(300px,1fr) minmax(260px,1.05fr) minmax(300px,390px);min-height:0}

/* Left: the cookie */
#left{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;
  background:radial-gradient(ellipse at 50% 55%,#6B4029 0%,#3A2419 50%,#24140D 100%);border-right:2px solid var(--line)}
#fxBack,#fxFront{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#fxBack{z-index:1} #fxFront{z-index:3}
.bakery{position:relative;z-index:4;margin-top:14px;display:flex;align-items:baseline;font-family:var(--slab);font-size:1.3rem}
.bakery input{background:transparent;border:0;border-bottom:2px dashed transparent;color:var(--cream);font:inherit;text-align:right;padding:0;min-width:3ch}
.bakery input:hover,.bakery input:focus{border-bottom-color:var(--muted);outline:none}
#count{position:relative;z-index:4;font-family:var(--slab);font-weight:700;font-size:clamp(1.7rem,3.6vw,2.6rem);color:var(--gold);text-align:center;line-height:1.1;margin-top:6px;text-shadow:0 3px 0 var(--dark);padding:0 10px}
#count small{display:block;font-size:.45em;color:var(--cream);text-shadow:none;font-weight:400}
#cpsline{position:relative;z-index:4;color:var(--muted);font-size:.95rem;margin-top:2px}
#buffs{position:relative;z-index:4;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px;min-height:26px}
.buff{background:var(--dark);border:1px solid var(--gold);border-radius:14px;padding:3px 10px;font-size:.8rem;position:relative;overflow:hidden}
.buff i{position:absolute;left:0;bottom:0;height:3px;background:var(--gold)}
#stage{flex:1;width:100%;display:grid;place-items:center;position:relative;z-index:2;min-height:0}
#cookieBtn{background:none;border:0;padding:0;border-radius:50%;width:min(250px,56vw,34vh);aspect-ratio:1;
  transition:transform .3s cubic-bezier(.3,1.9,.5,1);filter:drop-shadow(0 16px 20px rgba(0,0,0,.5))}
#cookieBtn:hover{transform:scale(1.05)}
#cookieBtn.press{transform:scale(.9);transition:transform .05s}
#cookieBtn svg{width:100%;height:100%;display:block}
.float{position:absolute;z-index:5;pointer-events:none;font-family:var(--slab);font-weight:700;color:#fff;text-shadow:0 2px 0 #0008;animation:rise 1s ease-out forwards;white-space:nowrap}
.float.gold{color:var(--gold);font-size:1.3rem;animation-duration:1.8s}
@keyframes rise{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-70px);opacity:0}}

/* Middle: bakery floor scenes */
#mid{overflow-y:auto;padding:12px;background:var(--panel);border-right:2px solid var(--line)}
h2{font-family:var(--slab);font-size:1.05rem;margin:4px 2px 10px;color:var(--cream);font-weight:700}
.empty{color:var(--muted);padding:30px 10px;text-align:center;line-height:1.5}
.scene{border-radius:14px;margin-bottom:8px;padding:6px 10px 4px;border:1px solid #0003;box-shadow:inset 0 -10px 20px #0003}
.scene header{all:unset;display:flex;justify-content:space-between;font-size:.8rem;color:#fffc}
.sprites{display:flex;flex-wrap:nowrap;gap:2px;height:44px;align-items:flex-end;overflow:hidden;font-size:26px;perspective:200px}
.sprites span{display:inline-block;transform-origin:50% 100%;line-height:1}
.sprites em{font-style:normal;font-size:.8rem;align-self:center;margin-left:6px;color:#fffb}
@keyframes tap{0%,78%,100%{transform:translateY(0)}88%{transform:translateY(7px)}}
@keyframes rock{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
@keyframes grow{0%,100%{transform:scaleY(.8)}50%{transform:scaleY(1.12)}}
@keyframes sparkle{0%,100%{filter:brightness(1)}50%{filter:brightness(1.9) drop-shadow(0 0 5px #fff)}}
@keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(-1.5px,1px)}75%{transform:translate(1.5px,-1px)}}
@keyframes coin{to{transform:rotateY(360deg)}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 0 #F2C14E)}50%{filter:drop-shadow(0 0 9px #F2C14E)}}
@keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes launch{0%{transform:translateY(10px);opacity:0}15%{opacity:1}100%{transform:translateY(-60px);opacity:0}}
@keyframes bubble{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes hue{to{filter:hue-rotate(360deg)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-16deg)}75%{transform:rotate(16deg)}}

/* Right: the store */
#right{overflow-y:auto;padding:12px;background:var(--panel)}
#upgrades{display:grid;grid-template-columns:repeat(auto-fill,48px);gap:6px;margin-bottom:14px;min-height:48px}
.up{width:48px;height:48px;border-radius:8px;border:2px solid var(--line);background:var(--panel2);font-size:24px;display:grid;place-items:center;position:relative;padding:0}
.up.afford{border-color:var(--gold);animation:softGlow 2s ease-in-out infinite}
.up:not(.afford){opacity:.5}
.up b{position:absolute;right:2px;bottom:1px;font-size:.6rem;font-family:var(--slab)}
.up.sel{outline:3px solid var(--pist)}
@keyframes softGlow{50%{box-shadow:0 0 10px #F2C14E88}}
.upEmpty{grid-column:1/-1;color:var(--muted);font-size:.85rem;align-self:center}
.bulk{display:flex;gap:4px;margin-bottom:8px}
.bulk span{color:var(--muted);font-size:.85rem;align-self:center;margin-right:4px}
.bulk button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:3px 10px;font-size:.85rem}
.bulk button.on{background:var(--gold);color:var(--dark);border-color:var(--gold);font-weight:700}
.bld{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;
  background:var(--panel2);border:2px solid transparent;border-radius:14px;padding:8px 12px 8px 8px;margin-bottom:6px;transition:transform .12s}
.bld:active{transform:scale(.98)}
.bld .ic{font-size:30px;text-align:center}
.bld .nm{font-family:var(--slab);font-weight:700;font-size:1.02rem}
.bld .pr{font-size:.85rem;color:var(--muted)}
.bld .ow{font-family:var(--slab);font-size:1.7rem;color:#fff4;font-weight:700}
.bld.afford{border-color:#F2C14E99}
.bld.afford .pr{color:var(--pist)}
.bld:not(.afford){opacity:.6}
.bld.mystery .ic{filter:brightness(0);opacity:.45}
.bld.hidden{display:none}

/* Tooltip */
#tip{position:fixed;z-index:60;max-width:290px;background:var(--dark);border:1px solid var(--gold);border-radius:10px;padding:10px 12px;font-size:.85rem;line-height:1.4;pointer-events:none;display:none;box-shadow:0 10px 30px #000a}
#tip b{font-family:var(--slab);font-size:1rem;display:block}
#tip .c{color:var(--gold);display:block;margin:2px 0 6px}
#tip p{margin:0 0 6px}
#tip q{color:var(--muted);font-style:italic;display:block}

/* Golden cookie */
#golden{position:fixed;z-index:40;width:74px;height:74px;border:0;background:none;padding:0;display:none;animation:gspin 7s linear infinite,gpulse 1.2s ease-in-out infinite}
#golden svg{width:100%;height:100%;filter:drop-shadow(0 0 12px #FFD76A)}
@keyframes gspin{to{rotate:360deg}}
@keyframes gpulse{50%{scale:1.14}}
#golden.fade{transition:opacity .6s;opacity:0}

/* Sparkles, toasts, modals */
.spark{position:fixed;z-index:55;pointer-events:none;color:var(--gold);font-size:14px;animation:burst .7s ease-out forwards}
@keyframes burst{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
.flash{animation:flash .4s}
@keyframes flash{0%{background:#fff}}
#toasts{position:fixed;right:14px;bottom:14px;z-index:70;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:var(--dark);border:1px solid var(--pist);border-left:6px solid var(--pist);border-radius:10px;padding:8px 14px;max-width:300px;font-size:.85rem;animation:tin .35s cubic-bezier(.3,1.6,.5,1)}
.toast b{font-family:var(--slab);display:block;font-size:1rem}
.toast small{color:var(--pist)}
@keyframes tin{from{transform:translateX(120%)}}
#modal{position:fixed;inset:0;z-index:80;background:#0009;display:none;place-items:center;padding:16px}
#modal.on{display:grid}
#modalBox{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:20px;width:min(560px,100%);max-height:85vh;overflow:auto;position:relative}
#modalBox h3{font-family:var(--slab);margin:0 0 12px;font-size:1.4rem}
#modalClose{position:absolute;right:10px;top:8px;background:none;border:0;font-size:1.5rem;color:var(--muted)}
.statRow{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.statRow span:last-child{color:var(--gold);font-family:var(--slab)}
.achGrid{display:grid;grid-template-columns:repeat(auto-fill,34px);gap:4px;margin-top:10px}
.achGrid div{width:34px;height:34px;border-radius:6px;background:var(--dark);display:grid;place-items:center;font-size:16px;opacity:.3}
.achGrid div.got{opacity:1;background:var(--panel3);border:1px solid var(--gold)}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 14px;margin:4px 6px 4px 0}
.btn.primary{background:var(--gold);color:var(--dark);border-color:var(--gold);font-weight:700}
.btn.danger{background:#7A2C24;border-color:#A8453A}
textarea{width:100%;height:80px;background:var(--dark);color:var(--cream);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:.75rem;resize:vertical}
.muted{color:var(--muted);font-size:.9rem;line-height:1.5}

/* Ascension */
#ascend{position:fixed;inset:0;z-index:90;display:none;place-items:center;text-align:center;pointer-events:none}
#ascend.on{display:grid;animation:bloom 3.4s ease-in-out forwards}
#ascend div{font-family:var(--slab);color:#5A3A10;font-size:clamp(1.6rem,5vw,3rem);font-weight:700;animation:ascText 3.4s ease-in-out forwards}
@keyframes bloom{0%{background:radial-gradient(circle at 50% 100%,#FFF6D8 0%,transparent 0%)}40%{background:radial-gradient(circle at 50% 60%,#FFF6D8 30%,#F2C14E 100%)}75%{background:radial-gradient(circle,#fff 60%,#FFF6D8 100%)}100%{background:#fff0}}
@keyframes ascText{0%{opacity:0;transform:translateY(80px)}35%,75%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-80px)}}

/* Mobile tabs */
#tabs{display:none}
.tabIc{display:block;font-size:1.25rem;line-height:1.1}
@media (max-width:820px){
  #main{grid-template-columns:minmax(0,1fr);grid-template-rows:47% minmax(0,1fr)}
  #left{border-right:0;border-bottom:2px solid var(--line)}
  #mid,#right{grid-row:2;grid-column:1;border-right:0;padding-bottom:16px}
  #main[data-tab="store"] #mid{display:none}
  #main[data-tab="floor"] #right{display:none}
  #tabs{display:flex;background:var(--dark);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
  #tabs button{flex:1;background:none;border:0;padding:7px 4px 8px;color:var(--muted);font-family:var(--slab);font-size:.75rem;min-height:54px}
  #tabs button.on{color:var(--gold);box-shadow:inset 0 3px 0 var(--gold)}
  #ticker{min-height:36px}
  #ticker::before{content:"News";padding:0 10px}
  .menu #statsBtn,.menu #optBtn,.menu #soundBtn{display:none}
  .menu{padding:3px}
  #cookieBtn{width:min(210px,52vw,27vh)}
  .bakery{margin-top:8px;font-size:1.1rem}
  #count{font-size:clamp(1.6rem,8vw,2.2rem)}
  .bld{padding:10px 12px 10px 8px;min-height:62px}
  .up{width:52px;height:52px}
  #upgrades{grid-template-columns:repeat(auto-fill,52px)}
  .bulk button{padding:7px 14px}
  #toasts{top:calc(env(safe-area-inset-top) + 44px);bottom:auto;left:12px;right:12px;align-items:stretch}
  .toast{max-width:none;animation-name:tdown;padding:6px 12px;font-size:.8rem}
  .toast b{font-size:.9rem}
  @keyframes tdown{from{transform:translateY(-140%)}}
  #modal{place-items:end center;padding:0}
  #modalBox{border-radius:20px 20px 0 0;max-height:88vh;padding:22px 18px calc(22px + env(safe-area-inset-bottom));animation:sheet .3s cubic-bezier(.2,.9,.3,1)}
  #modalBox::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:-10px auto 12px}
  @keyframes sheet{from{transform:translateY(100%)}}
  .btn{padding:11px 16px}
}
@media (max-width:820px) and (max-height:600px){ #main{grid-template-rows:42% 1fr} #cpsline{display:none} }
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}
  #tickerText{padding-left:12px}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div id="ticker" role="marquee" aria-label="News"><span id="tickerText"></span></div>
    <div class="menu">
      <button id="ascendBtn">Ascend</button>
      <button id="statsBtn">Stats</button>
      <button id="optBtn">Options</button>
      <button id="soundBtn" aria-label="Toggle sound">🔊</button>
    </div>
  </header>

  <main id="main" data-tab="store">
    <!-- LEFT: cookie panel -->
    <section id="left">
      <canvas id="fxBack"></canvas>
      <div class="bakery"><input id="bname" maxlength="24" aria-label="Bakery owner name"><span>'s Bakery</span></div>
      <div id="count">0 <small>cookies</small></div>
      <div id="cpsline">per second: 0</div>
      <div id="buffs"></div>
      <div id="stage">
        <button id="cookieBtn" aria-label="Bake a cookie"><svg id="cookieSvg" viewBox="0 0 240 240"></svg></button>
      </div>
      <canvas id="fxFront"></canvas>
    </section>

    <!-- MIDDLE: animated building scenes -->
    <section id="mid"><h2>Bakery floor</h2><div id="scenes"></div></section>

    <!-- RIGHT: store -->
    <section id="right">
      <h2>Upgrades</h2>
      <div id="upgrades"></div>
      <h2>Buildings</h2>
      <div class="bulk"><span>Buy</span><button data-n="1" class="on">×1</button><button data-n="10">×10</button><button data-n="100">×100</button></div>
      <div id="store"></div>
    </section>
  </main>

  <nav id="tabs"><button data-tab="store" class="on"><span class="tabIc">🛒</span>Store</button><button data-tab="floor"><span class="tabIc">🏭</span>Bakery floor</button><button data-act="stats"><span class="tabIc">📊</span>Stats</button><button data-act="more"><span class="tabIc">⚙️</span>More</button></nav>
</div>

<button id="golden" aria-label="Golden cookie"><svg viewBox="0 0 100 100"><defs><radialGradient id="gg" cx="40%" cy="35%"><stop offset="0" stop-color="#FFF6C9"/><stop offset=".6" stop-color="#F7C948"/><stop offset="1" stop-color="#C98A12"/></radialGradient></defs><circle cx="50" cy="50" r="44" fill="url(#gg)" stroke="#A8700C" stroke-width="3"/><circle cx="35" cy="38" r="6" fill="#D99A1A"/><circle cx="62" cy="33" r="5" fill="#D99A1A"/><circle cx="58" cy="60" r="7" fill="#D99A1A"/><circle cx="33" cy="64" r="5" fill="#D99A1A"/><path d="M22 30 L26 22 L30 30 L38 34 L30 38 L26 46 L22 38 L14 34 Z" fill="#fff" opacity=".85"/></svg></button>
<div id="tip"></div>
<div id="toasts"></div>
<div id="modal" role="dialog" aria-modal="true"><div id="modalBox"><button id="modalClose" aria-label="Close">×</button><div id="modalBody"></div></div></div>
<div id="ascend"><div id="ascendText"></div></div>

<script>
/* =========================================================
   Crumbworks Bakery — a cookie clicker-style idle game
   ========================================================= */
const $ = s => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const KEY = 'crumbworks-save-v1';

/* ---------- Number formatting ---------- */
const UNITS = ['million','billion','trillion','quadrillion','quintillion','sextillion','septillion','octillion','nonillion','decillion','undecillion','duodecillion'];
function fmt(n, dec) {
  if (!isFinite(n)) return 'Infinity';
  if (n < 0) return '-' + fmt(-n, dec);
  if (n < 1e6) {
    if (dec && n < 100 && n % 1) return n.toFixed(1);
    return Math.floor(n).toLocaleString('en-US');
  }
  const e = Math.floor(Math.log10(n) / 3) * 3, i = e / 3 - 2;
  if (i >= UNITS.length) return n.toExponential(2);
  return (n / Math.pow(10, e)).toFixed(3).replace(/\.?0+$/, '') + ' ' + UNITS[i];
}
function fmtTime(s) {
  s = Math.floor(s); const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return (d ? d + 'd ' : '') + (h ? h + 'h ' : '') + m + 'm ' + (s % 60) + 's';
}

/* ---------- Buildings ---------- */
const BUILD = [
  ['cursor','Cursor','👆',15,0.1,'Taps the cookie for you. Asks for nothing. Suspicious.','Index Fingers','tap 2.4s ease-in-out infinite'],
  ['grandma','Grandma','👵',100,1,'Bakes with love, butter, and forty years of opinions.','Rolling Pins','rock 2.2s ease-in-out infinite'],
  ['farm','Farm','🌾',1100,8,'Rows of cookie shrubs. The scarecrow is also a cookie.','Hoes','grow 3s ease-in-out infinite'],
  ['mine','Mine','⛏️',12000,47,'Chocolate veins run deep under the hills.','Pickaxes','sparkle 1.8s ease-in-out infinite'],
  ['factory','Factory','🏭',130000,260,'Smokestacks that smell like vanilla. The neighbors stopped complaining.','Conveyor Belts','shake .25s linear infinite'],
  ['bank','Bank','🏦',1.4e6,1400,'Compound interest, paid out in crumbs.','Vaults','coin 3s linear infinite'],
  ['temple','Temple','🛕',2e7,7800,'Monks meditate on the perfect crunch.','Incense Sticks','glow 2.6s ease-in-out infinite'],

/* ---------- Production math ---------- */
function calc() {
  const tiers = {}; let fingers = 0, mice = 0, flavor = 0, kit = 1, trophy = 1, gf = 1, gd = 1; const gm = [];
  const milk = A.size * 0.04;
  for (const id of U) {
    const u = UPI[id]; if (!u) continue;
    if (u.kind === 'tier') tiers[u.b] = (tiers[u.b] || 0) + 1;
    else if (u.kind === 'mouse') mice++;
    else if (u.kind === 'finger') fingers += u.v;
    else if (u.kind === 'gma') gm.push(u.b);
    else if (u.kind === 'flavor') flavor += u.v;
    else if (u.kind === 'gold') u.v === 'freq' ? gf *= 2 : gd *= 2;
    else if (u.kind === 'kitten') kit *= 1 + milk * u.v;
    else if (u.kind === 'trophy') trophy = 1.0001;
  }
  let total = 0; BUILD.forEach(b => total += own(b.id));
  const nonCursor = total - own('cursor'), gOwn = own('grandma');
  const mult = {}; BUILD.forEach(b => mult[b.id] = Math.pow(2, tiers[b.id] || 0));
  gm.forEach(id => { mult.grandma *= 2; mult[id] *= 1 + gOwn / 400; });
  const global = (1 + flavor / 100) * (1 + S.chips / 100) * kit * trophy;
  let raw = 0; const per = {};
  BUILD.forEach(b => {
    const unit = b.cps + (b.id === 'cursor' ? fingers * nonCursor : 0);
    per[b.id] = own(b.id) * unit * mult[b.id] * global; raw += per[b.id];
  });
  const now = Date.now();
  const frenzy = buffs.frenzy && buffs.frenzy.end > now ? 7 : 1;
  const cf = buffs.clickfrenzy && buffs.clickfrenzy.end > now ? 777 : 1;
  const cps = raw * frenzy;
  const click = ((Math.pow(2, Math.min(tiers.cursor || 0, 3)) + fingers * nonCursor) * global + cps * mice * 0.01) * cf;
  C = { cps, base: raw, per, click, goldFreq: gf, goldDur: gd, total };
}
function gain(v) { S.cookies += v; S.baked += v; S.bakedAll += v; }

  const a = ac(); if (!a || !S.sound) return;
  const t = a.currentTime + (delay || 0), o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);

}

  if (!RM) {

  buzz(5);
  if (b.dataset.act === 'stats') return $('#statsBtn').click();
  if (b.dataset.act === 'more') return $('#optBtn').click();
  $('#main').dataset.tab = b.dataset.tab;
  document.querySelectorAll('#tabs button[data-tab]').forEach(x => x.classList.toggle('on', x === b));
}));

/* ---------- Install as an app ---------- */
let installEvt = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; });
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function installHtml() {
  if (isStandalone()) return '<p class="muted">Installed. You are playing the app version.</p>';
  if (installEvt) return '<button class="btn primary" id="oInstall">Install Crumbworks</button>';
  if (isIOS()) return '<p class="muted">In Safari, tap the Share button, then choose Add to Home Screen.</p>';
  return '<p class="muted">Open your browser menu and choose Install app or Add to Home Screen.</p>';
}
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

/* ---------- Save system ---------- */
function serialize() { S.ups = [...U]; S.ach = [...A]; S.unl = [...UNL]; S.rev = [...REV]; S.last = Date.now(); return JSON.stringify(S); }
function encode() { return btoa(unescape(encodeURIComponent(serialize()))); }
function decode(str) { const o = JSON.parse(decodeURIComponent(escape(atob(str.trim())))); if (typeof o.cookies !== 'number') throw 0; return o; }
// Inside Claude: window.storage. Hosted as a web app: the browser's localStorage.
async function save() {
  const data = serialize();
  try { if (window.storage && window.storage.set) { await window.storage.set(KEY, data, false); return; } } catch (e) {}
  try { localStorage.setItem(KEY, data); } catch (e) {}
}
async function load() {
  try { if (window.storage && window.storage.get) { const r = await window.storage.get(KEY, false); if (r && r.value) return JSON.parse(r.value); } } catch (e) {}
  try { const v = localStorage.getItem(KEY); if (v) return JSON.parse(v); } catch (e) {}
  return null;
}
addEventListener('pagehide', save);
let saveTimer = null; function queueSave() { clearTimeout(saveTimer); saveTimer = setTimeout(save, 1000); }
setInterval(save, 30000);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });

/* ---------- Main loops ---------- */
function resetView() {
  bname.value = S.name; sizeName(); syncSoundBtn(); calc(); buildStore(); buildScenes(); upKey = ''; renderUpgrades(); renderStore(); applyCosmetics(); scheduleGolden(); shown = S.cookies;
}
let lastLogic = Date.now(), slowT = 0;
function logic() {
  const now = Date.now(), dt = Math.min((now - lastLogic) / 1000, 86400); lastLogic = now;
  calc(); gain(C.cps * dt);
  if (goldenEl.style.display !== 'block' && now >= nextGolden) spawnGolden();
  slowT += dt;
  if (slowT >= .5) {
    slowT = 0;
    UP.forEach(u => { if (!U.has(u.id) && !UNL.has(u.id) && u.unlock()) UNL.add(u.id); });
    ACH.forEach(a => { if (!A.has(a.id) && a.test()) { A.add(a.id); toast('Achievement unlocked', a.name, a.desc); sfx('ach'); } });
    $('#ascendBtn').style.display = chipGain() >= 1 ? 'inline-block' : 'none';
    BUILD.forEach(b => { if (own(b.id)) sceneEls[b.id].querySelector('.n').textContent = `${own(b.id)} owned · ${fmt(C.per[b.id], true)}/s`; });
  }
  renderStore(); renderUpgrades(); renderBuffs();
}
let lastFrame = performance.now();
function frame(t) {
  const dt = Math.min((t - lastFrame) / 1000, .1); lastFrame = t;
  shown += (S.cookies - shown) * Math.min(1, dt * 10);
  if (Math.abs(S.cookies - shown) < 1) shown = S.cookies;
  $('#count').innerHTML = `${fmt(shown)} <small>cookie${Math.floor(shown) === 1 ? '' : 's'}</small>`;
  $('#cpsline').textContent = `per second: ${fmt(C.cps, true)}` + (C.cps !== C.base ? ' (frenzy!)' : '');
  document.title = `${fmt(S.cookies)} cookies · ${S.name}'s Bakery`;
  drawFx(t / 1000, dt);
  requestAnimationFrame(frame);
}

/* ---------- Boot ---------- */
(async function init() {
  buildCookieSvg();
  const saved = await load();
  if (saved) applyState(saved);
  resetView(); resize(); nextNews();
  if (saved) {
    const away = (Date.now() - (saved.last || Date.now())) / 1000;
    if (away > 60) {
      const earned = C.base * away * .5; gain(earned); shown = 0;
      openModal(`<h3>Welcome back!</h3><p class="muted">You were away for ${fmtTime(away)}. Your bakery kept the ovens warm at half speed.</p>
        <div class="statRow"><span>Cookies baked while you were away</span><span>+${fmt(earned)}</span></div>
        <p><button class="btn primary" onclick="closeModal()">Back to baking</button></p>`);
    }
  }
  lastLogic = Date.now(); setInterval(logic, 50); requestAnimationFrame(frame);
  new ResizeObserver(resize).observe($('#left'));
})();
</script>
</body>
